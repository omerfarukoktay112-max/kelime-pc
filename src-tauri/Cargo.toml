[package]
name = "kelime"
version = "1.0.0"
description = "kelime: Türkçe arayüzle İngilizce kelime öğren (Windows sürümü)"
authors = ["omerfarukoktay112-max"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "kelime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Globalization", "Media_SpeechRecognition", "Win32_System_WinRT"] }
windows-collections = "0.3.2"
windows-future = "0.3.2"

[dev-dependencies]
tempfile = "3.27.0"
