name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Ön yüz testleri
        run: |
          npm test
          npm run typecheck

      - name: Rust testleri
        working-directory: src-tauri
        run: cargo test --locked

      - name: Kurulum dosyası
        run: npx tauri build

      - name: Uygulamayı çalıştır ve ölç
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe "src-tauri/target/release/kelime.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: kelime-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            smoke-report.txt

      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
